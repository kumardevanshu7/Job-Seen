<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – JobSeen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, monospace;
      background: #fdfcfc;
      color: #424245;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .nav {
      height: 56px;
      border-bottom: 1px solid rgba(15,0,0,0.12);
      display: flex;
      align-items: center;
      padding: 0 32px;
    }
    .nav-brand {
      font-size: 14px;
      font-weight: 700;
      color: #201d1d;
    }
    .content {
      flex: 1;
      max-width: 480px;
      margin: 96px auto;
      padding: 0 32px;
      width: 100%;
    }
    h1 {
      font-size: 38px;
      font-weight: 700;
      color: #201d1d;
      line-height: 1.5;
      margin-bottom: 16px;
    }
    p {
      font-size: 16px;
      color: #646262;
      line-height: 1.5;
      margin-bottom: 32px;
    }
    .divider {
      height: 1px;
      background: rgba(15,0,0,0.12);
      margin-bottom: 32px;
    }
    button {
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      background: #201d1d;
      color: #fdfcfc;
      border: none;
      padding: 4px 20px;
      height: 36px;
      border-radius: 4px;
      cursor: pointer;
      line-height: 2;
    }
    button:hover { background: #302c2c; }
  </style>
</head>
<body>
  <div class="nav"><span class="nav-brand">JOBSEEN</span></div>
  <div class="content">
    <div class="divider"></div>
    <h1>you're offline</h1>
    <p>JobSeen needs an internet connection to sync your job listings. check your connection and try again.</p>
    <button onclick="window.location.reload()">[+] try again</button>
  </div>
</body>
</html>
